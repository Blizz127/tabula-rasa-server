services:
  auth:
    image: rasa_net_auth
    restart: always
    build: .
    # Release build published by the Dockerfile into /app/src/Rasa.Auth; the working directory stays /app.
    command: dotnet src/Rasa.Auth/Rasa.Auth.dll
    # Guardrail: Auth settles well under 100 MB; a runaway is stopped (and restarted) instead of starving the host.
    mem_limit: 512m
    stdin_open: true
    tty: true
    ports:
      - "2106:2106"
      # The Banshee Realm launcher's Tabula Rasa integration expects the auth server on 2116
      # (TabulaRasaLaunchPlan.DefaultAuthPort, docs/MARVEL_HEROES_TABULA_RASA.md); Rasa.NET's own
      # default is 2106. Publish both so either client configuration reaches the same listener.
      - "2116:2106"
      # 2107 Communicator is NOT published — internet scanners were connecting as fake
      # "game servers" and disrupting registration. Game reaches auth:2107 on docker net.
    volumes:
      - ./rasaauth.db:/app/rasaauth.db
  game:
    image: rasa_net_game
    restart: always
    build: .
    # Release build published by the Dockerfile into /app/src/Rasa.Game; the working directory stays /app, so the
    # databases, navmesh, dit and kb-articles.json resolve where they did under `dotnet run`.
    command: dotnet src/Rasa.Game/Rasa.Game.dll
    # Guardrail: a runaway Game is stopped (and restarted by `restart: always`) instead of starving the host.
    mem_limit: 3g
    stdin_open: true
    tty: true
    ports:
      - "8102:8102"
      - "8001:8001"
    volumes:
      - ./rasachar.db:/app/rasachar.db
      - ./rasaworld.db:/app/rasaworld.db
      - ./appsettings.env.json:/app/src/Rasa.Game/appsettings.env.json
      # The server reads its per-map navmeshes from NavMeshPath (navmesh). The running container carried
      # this mount ad hoc, so recreating it from this file lost the navmesh and creatures fell back to
      # straight-line movement. The repository copy is byte-identical to the mounted one.
      - ./navmesh:/app/navmesh
