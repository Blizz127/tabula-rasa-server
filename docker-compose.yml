services:
  auth:
    image: rasa_net
    restart: always
    build: .
    command: dotnet run --project src/Rasa.Auth/Rasa.Auth.csproj
    stdin_open: true
    tty: true
    ports:
      - "2106:2106"
      # The Banshee Realm launcher's Tabula Rasa integration expects the auth server on 2116
      # (TabulaRasaLaunchPlan.DefaultAuthPort, docs/MARVEL_HEROES_TABULA_RASA.md); Rasa.NET's own
      # default is 2106. Publish both so either client configuration reaches the same listener.
      - "2116:2106"
      - "2107:2107"
    volumes:
      - ./rasaauth.db:/app/rasaauth.db
  game:
    image: rasa_net
    restart: always
    build: .
    command: dotnet run --project src/Rasa.Game/Rasa.Game.csproj
    stdin_open: true
    tty: true
    ports:
      - "8102:8102"
      - "8001:8001"
    volumes:
      - ./rasachar.db:/app/rasachar.db
      - ./rasaworld.db:/app/rasaworld.db
      - ./appsettings.env.json:/app/src/Rasa.Game/appsettings.env.json
      # The server reads its per-map navmeshes from NavMeshPath (navmesh). The running container carried
      # this mount ad hoc, so recreating it from this file lost the navmesh and creatures fell back to
      # straight-line movement. The repository copy is byte-identical to the mounted one.
      - ./navmesh:/app/navmesh

